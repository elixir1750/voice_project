experiment:
  name: baseline_wav2vec2_mlp
  seed: 42

data:
  dataset_name: librispeech_asr
  dataset_config: clean
  train_split: train.100
  validation_split: validation
  streaming: true
  train_samples: 3600
  validation_samples: 500
  sample_rate: 16000
  shuffle_buffer: 2000

tokenizer:
  type: character_ctc

ssl:
  type: wav2vec2
  model_name: facebook/wav2vec2-base
  frozen: true
  layer: -1

representation:
  type: continuous

decoder:
  type: mlp
  hidden_dim: 512
  dropout: 0.1

training:
  epochs: 10
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 2
  pin_memory: true
  amp: true

runtime:
  device: auto
  output_dir: outputs/baseline_wav2vec2_mlp
  cache_dir: hf_cache
